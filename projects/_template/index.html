<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Title</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #22c55e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
    }

    main {
      width: min(720px, 100%);
      background: var(--panel);
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 24px;
    }

    h1 { margin-top: 0; }
    p { line-height: 1.6; color: var(--muted); }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.15);
      color: var(--accent);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">Template</span>
    <h1>Project Title</h1>
    <p>
      Replace this page with your experiment. Keep this file as a single self-contained
      `index.html` unless your project needs extra assets.
    </p>
  </main>
</body>
</html>
